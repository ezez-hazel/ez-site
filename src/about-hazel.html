                      <h1
                        class="liver-profile_liverName__SU689 liver-profile_scFontName__IfvgI page-title_pageTitle__F5wYh"
                        data-testid="PageTitle"
                      >
                        灰泽满
                      </h1>
                      <p class="liver-profile_liverRuby__WYI5L">へーぜる</p>
                      <p class="liver-profile_liverEnName__guVEu">Hazel</p>
                      <p
                        class="liver-profile_liverDescription__0se0l liver-profile_scFontDescription__iDUoG liver-profile_pcOnly__qFdJO"
                      >
                        灰泽满早就习惯了转学生活。每隔几年，她就要收拾好书包，换上新的名字，重新开始一段学生生涯。毕竟，一个外表永远停留在十六岁的少女，在一所中学里待得太久，总会引来旁人的怀疑。
                        为了掩饰身份，灰泽满的学生档案摞起来竟比她珍藏的果冻收藏品还要高。没错，就是果冻
                        ——
                        她对这种半透明、晃悠悠的小东西，有着近乎偏执的喜爱。书包挂件、笔记本封面、睡衣图案，无一不是果冻造型。宿舍的角落里，还藏着一个果冻应急储备箱。心情好的时候，她会吃上一个；心情不好的时候，就一口气吃掉三个。
                        最近，她又转入了一所新的学校，还凭借丰富的
                        “学生经验”成功当选为风纪委员。每天站在校门口登记违纪名单时，她总会在心里默默盘算：这一次能在这里待多久？会不会又被卷入到离奇的事件中？
                        而最重要的是 —— 这一次，她能解开自己的身世之谜吗？
                      </p>

                  <p
                    class="liver-profile_liverDescription__0se0l liver-profile_scFontDescription__iDUoG"
                  >
                    灰泽满早就习惯了转学生活。每隔几年，她就要收拾好书包，换上新的名字，重新开始一段学生生涯。毕竟，一个外表永远停留在十六岁的少女，在一所中学里待得太久，总会引来旁人的怀疑。
                    为了掩饰身份，灰泽满的学生档案摞起来竟比她珍藏的果冻收藏品还要高。没错，就是果冻
                    ——
                    她对这种半透明、晃悠悠的小东西，有着近乎偏执的喜爱。书包挂件、笔记本封面、睡衣图案，无一不是果冻造型。宿舍的角落里，还藏着一个果冻应急储备箱。心情好的时候，她会吃上一个；心情不好的时候，就一口气吃掉三个。
                    最近，她又转入了一所新的学校，还凭借丰富的
                    “学生经验”成功当选为风纪委员。每天站在校门口登记违纪名单时，她总会在心里默默盘算：这一次能在这里待多久？会不会又被卷入到离奇的事件中？
                    而最重要的是 —— 这一次，她能解开自己的身世之谜吗？
                  </p>
